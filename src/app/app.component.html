<main class="layout">
  <section class="layout__content">
    <div class="connection-status">
      <p class="connection-status__error" *ngIf="connectionError">{{ connectionError }}</p>
      <p class="connection-status__error" *ngIf="(error$ | async) as liveError">{{ liveError }}</p>
    </div>

    <ng-container *ngIf="vm$ | async as vm">
      <ng-container *ngIf="vm.question as question; else waiting">
        <ng-container *ngIf="role$ | async as role">
          <ng-container *ngIf="role === 'admin'; else viewerView">
            <ng-container *ngIf="vm.state?.revealResults; else adminQuestion">
              <div class="admin-controls">
                <button
                  type="button"
                  class="admin-controls__button admin-controls__button--secondary"
                  (click)="onNextQuestion()"
                  [disabled]="!canGoToNextQuestion(vm.state)"
                >
                  Question suivante
                </button>
              </div>

              <app-question-results
                [question]="question"
                [results]="vm.results"
                [visible]="true"
              ></app-question-results>
            </ng-container>

            <ng-template #adminQuestion>
              <app-question
                [question]="question"
                [locked]="true"
                [showSubmitButton]="false"
                [showChoices]="false"
              ></app-question>

              <div class="admin-controls">
                <button
                  type="button"
                  class="admin-controls__button"
                  (click)="onCloseQuestion()"
                  [disabled]="!canCloseQuestion(vm.state)"
                >
                  Fermer la question
                </button>
                <button
                  type="button"
                  class="admin-controls__button admin-controls__button--secondary"
                  (click)="onNextQuestion()"
                  [disabled]="!canGoToNextQuestion(vm.state)"
                >
                  Question suivante
                </button>
              </div>

              <app-question-results
                [question]="question"
                [results]="vm.results"
                [visible]="false"
                [showPendingMessage]="false"
              ></app-question-results>
            </ng-template>
          </ng-container>

          <ng-template #viewerView>
            <ng-container *ngIf="(vm.state?.revealResults ?? false) || (vm.state?.locked ?? false); else viewerQuestion">
              <app-question
                [question]="question"
                [locked]="true"
                [showSubmitButton]="false"
                [showChoices]="false"
              ></app-question>
              <app-question-results
                [question]="question"
                [results]="vm.results"
                [visible]="true"
                [showPendingMessage]="false"
              ></app-question-results>
            </ng-container>

            <ng-template #viewerQuestion>
              <ng-container *ngIf="!hasSubmittedAnswer; else answeredWaiting">
                <app-question
                  [question]="question"
                  [locked]="vm.state?.locked ?? false"
                  (submitAnswer)="onSubmitAnswer($event)"
                ></app-question>
              </ng-container>

              <ng-template #answeredWaiting>
                <app-question
                  [question]="question"
                  [locked]="true"
                  [showSubmitButton]="false"
                  [showChoices]="false"
                ></app-question>
                <app-question-results
                  [question]="question"
                  [results]="vm.results"
                  [visible]="(vm.state?.revealResults ?? false) || (vm.state?.locked ?? false)"
                  [showPendingMessage]="!((vm.state?.revealResults ?? false) || (vm.state?.locked ?? false))"
                ></app-question-results>
              </ng-template>
            </ng-template>
          </ng-template>
        </ng-container>
      </ng-container>
    </ng-container>

    <ng-template #waiting>
      <div class="placeholder">
        <h2>Sélectionnez un formulaire pour commencer</h2>
        <p>Renseignez l'identifiant du formulaire pour rejoindre une session.</p>
      </div>
    </ng-template>
  </section>
</main>
